# heroku production profile, activated by setting SPRING_PROFILES_ACTIVE=prod
# the heroku java buildpack converts DATABASE_URL (postgres://) to the JDBC_ vars below
# dont hardcode credentials here, they come from heroku config vars

spring.datasource.url=${JDBC_DATABASE_URL}
spring.datasource.username=${JDBC_DATABASE_USERNAME}
spring.datasource.password=${JDBC_DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# jpa - turned off sql logging in prod, no need for it
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# session stored in postgres, schema gets created automaticaly
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always
spring.session.timeout=3600

# run data.sql on startup to seed the db
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# dates as ISO strings not timestamps
spring.jackson.serialization.write-dates-as-timestamps=false
