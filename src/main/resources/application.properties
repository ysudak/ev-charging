# app name
spring.application.name=ev-charging-booking

# local postgres settings, override these on heroku via application-prod.properties
spring.datasource.url=jdbc:postgresql://localhost:5432/evbooking
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# jpa/hibernate - 'update' creates/alters tables automaticaly, fine for dev and coursework
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# spring session stored in postgres so all heroku dynos share the same sessions
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always
spring.session.timeout=3600

# data.sql runs on every startup, ON CONFLICT DO NOTHING stops duplicate errors on restart
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# port
server.port=8080

# use ISO date format, not timestamps
spring.jackson.serialization.write-dates-as-timestamps=false
