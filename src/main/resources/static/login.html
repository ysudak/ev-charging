<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#0969da"/>
  <title>VoltBook — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"/>
  <link rel="stylesheet" href="/css/style.css"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            accent:  { DEFAULT: '#0969da', dark: '#0860ca', light: '#ddf4ff' },
            success: { DEFAULT: '#1a7f37', light: '#d1f0db' },
            warning: { DEFAULT: '#9a6700', light: '#fff8c5' },
            danger:  { DEFAULT: '#cf222e', light: '#ffdce0' },
            ev: { text: '#24292f', sub: '#57606a', muted: '#8c959f', border: '#d0d7de', bg: '#f6f8fa', white: '#ffffff', hover: '#f0f3f7' },
          },
          fontFamily: { sans: ['Outfit', 'system-ui', 'sans-serif'], mono: ['JetBrains Mono', 'ui-monospace', 'monospace'] },
        }
      }
    }
  </script>
</head>
<body class="min-h-screen bg-ev-bg font-sans text-ev-text flex items-center justify-center px-4 py-12">

  <div class="w-full max-w-sm">

    <div class="text-center mb-6">
      <a href="/index.html" class="text-base font-semibold text-ev-text hover:text-accent" style="text-decoration:none;">VoltBook</a>
    </div>

    <div class="bg-ev-white border border-ev-border rounded-lg p-6 shadow-sm">

      <h1 class="text-lg font-semibold text-ev-text mb-5">Sign in</h1>

      <div id="alert-area"></div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <input id="username" type="text" class="form-control"
                 placeholder="e.g. driver1" autocomplete="username" required/>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="password-wrapper">
            <input id="password" type="password" class="form-control"
                   placeholder="Password" autocomplete="current-password" required/>
            <button type="button" class="password-toggle" id="pw-toggle" aria-label="Show password">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-full mt-1" id="submit-btn">Sign In</button>
      </form>

    </div>

    <p class="text-center text-sm text-ev-sub mt-4">
      Don't have an account? <a href="/register.html" class="font-medium text-accent">Register</a>
    </p>

  </div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script>
  API.get('/api/auth/me').then(user => {
    if (user && user.id) window.location.href = '/dashboard.html';
  }).catch(() => {});

  document.getElementById('pw-toggle').addEventListener('click', function () {
    const pw = document.getElementById('password');
    const hidden = pw.type === 'password';
    pw.type = hidden ? 'text' : 'password';
    this.setAttribute('aria-label', hidden ? 'Hide password' : 'Show password');
  });

  document.getElementById('login-form').addEventListener('submit', async e => {
    e.preventDefault();
    const btn        = document.getElementById('submit-btn');
    const usernameEl = document.getElementById('username');
    const passwordEl = document.getElementById('password');

    btn.disabled = true;
    btn.innerHTML = '<span class="btn-spinner"></span> Signing in…';
    clearAlert();
    usernameEl.classList.remove('error');
    passwordEl.classList.remove('error');

    try {
      const user = await API.post('/api/auth/login', {
        username: usernameEl.value.trim(),
        password: passwordEl.value
      });
      sessionStorage.setItem('user', JSON.stringify(user));
      window.location.href = user.role === 'ADMIN' ? '/admin.html' : '/dashboard.html';
    } catch (err) {
      showAlert(err.message || 'Invalid credentials.', 'error');
      passwordEl.classList.add('error');
      btn.disabled = false;
      btn.textContent = 'Sign In';
    }
  });

  function showAlert(msg, type) {
    document.getElementById('alert-area').innerHTML =
      `<div class="alert alert-${type}" role="alert">${msg}</div>`;
  }
  function clearAlert() { document.getElementById('alert-area').innerHTML = ''; }
</script>
</body>
</html>
